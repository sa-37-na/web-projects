</p>

<p>クラゲの魅力：</p>
<ul>
  <li>5億年以上も前から生き続けている神秘的な生き物</li>
  <li>光を通す透明な体で、幻想的な見た目をしている</li>
  <li>海の流れに身を任せて、ゆったりと動く癒しの存在</li>
</ul>
